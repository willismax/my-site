<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">LINE AI 課程助教系統架構</title>
  <desc id="desc">學員透過 LINE 傳訊息，LINE Messaging API 轉送到 GAS，GAS 串接 Gemini 與 Google 試算表，最後回覆 Flex Message 並保存紀錄。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7ff"/>
      <stop offset="1" stop-color="#f7fbf4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1f2937" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 34px "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke: #dbe7f3; stroke-width: 2; filter: url(#shadow); }
      .node-title { font: 700 25px "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif; fill: #111827; }
      .node-text { font: 400 17px "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif; fill: #475569; }
      .pill { fill: #e0f2fe; stroke: #38bdf8; stroke-width: 1.5; }
      .pill-text { font: 700 16px "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif; fill: #0369a1; }
      .arrow { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .small { font: 400 15px "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="64" y="72" class="title">LINE AI 課程助教：資料流與服務分工</text>
  <text x="64" y="106" class="subtitle">把 LINE、GAS、Gemini 與 Google 試算表串起來，形成可維護的課程問答流程。</text>

  <rect x="64" y="185" width="190" height="170" rx="20" class="card"/>
  <circle cx="159" cy="242" r="36" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
  <path d="M142 246c12 14 25 14 37 0M139 233h40" stroke="#16a34a" stroke-width="6" stroke-linecap="round" fill="none"/>
  <text x="159" y="306" text-anchor="middle" class="node-title">學員</text>
  <text x="159" y="334" text-anchor="middle" class="node-text">文字 / 截圖提問</text>

  <rect x="320" y="185" width="220" height="170" rx="20" class="card"/>
  <rect x="369" y="222" width="122" height="54" rx="18" fill="#00b900"/>
  <text x="430" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">LINE</text>
  <text x="430" y="306" text-anchor="middle" class="node-title">Messaging API</text>
  <text x="430" y="334" text-anchor="middle" class="node-text">Webhook 轉送</text>

  <rect x="612" y="160" width="270" height="220" rx="24" class="card"/>
  <rect x="682" y="201" width="130" height="64" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <text x="747" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#92400e">GAS</text>
  <text x="747" y="306" text-anchor="middle" class="node-title">Apps Script</text>
  <text x="747" y="334" text-anchor="middle" class="node-text">流程控制 / 快取 / 回覆</text>

  <rect x="950" y="120" width="240" height="150" rx="20" class="card"/>
  <circle cx="998" cy="173" r="24" fill="#e0e7ff" stroke="#6366f1" stroke-width="3"/>
  <text x="1070" y="166" text-anchor="middle" class="node-title">Gemini</text>
  <text x="1070" y="196" text-anchor="middle" class="node-text">生成回答</text>
  <text x="1070" y="224" text-anchor="middle" class="node-text">圖片理解</text>

  <rect x="950" y="330" width="240" height="190" rx="20" class="card"/>
  <rect x="984" y="368" width="172" height="82" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
  <line x1="984" y1="396" x2="1156" y2="396" stroke="#10b981" stroke-width="2"/>
  <line x1="1042" y1="368" x2="1042" y2="450" stroke="#10b981" stroke-width="2"/>
  <text x="1070" y="486" text-anchor="middle" class="node-title">Google 試算表</text>
  <text x="1070" y="514" text-anchor="middle" class="node-text">QA 知識庫 / 聊天紀錄</text>

  <path d="M254 270 H314" class="arrow"/>
  <path d="M540 270 H604" class="arrow"/>
  <path d="M882 241 C915 205 926 190 946 182" class="arrow"/>
  <path d="M882 330 C914 370 925 407 946 425" class="arrow"/>
  <path d="M612 331 C520 420 355 430 238 355" class="arrow"/>

  <rect x="64" y="565" width="1116" height="86" rx="18" fill="#ffffff" stroke="#dbe7f3" stroke-width="2"/>
  <rect x="92" y="591" width="150" height="34" rx="17" class="pill"/>
  <text x="167" y="614" text-anchor="middle" class="pill-text">安全邊界</text>
  <text x="270" y="615" class="small">密鑰放 Script Properties，QA 放試算表，Webhook URL 加 shared secret，聊天紀錄定期清理或脫敏。</text>
</svg>
