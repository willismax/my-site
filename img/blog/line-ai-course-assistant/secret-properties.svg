<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">GAS 指令碼屬性保存 API Key</title>
  <desc id="desc">示意 API Key 不應寫在程式碼中，而應存放在 Apps Script 的指令碼屬性，再由程式讀取。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1f2937" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <style>
      .title { font: 700 34px "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; filter: url(#shadow); }
      .card-title { font: 700 25px "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif; fill: #111827; }
      .body { font: 400 18px "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif; fill: #475569; }
      .code { font: 700 17px Consolas, "Courier New", monospace; fill: #334155; }
      .bad { fill: #fee2e2; stroke: #ef4444; stroke-width: 2; }
      .good { fill: #dcfce7; stroke: #22c55e; stroke-width: 2; }
      .arrow { stroke: #0f766e; stroke-width: 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="64" y="72" class="title">API Key 保管：不要放程式碼，改放 Script Properties</text>
  <text x="64" y="106" class="subtitle">教學範例可以公開，真正的鑰匙不該跟著一起複製、截圖或上傳。</text>

  <rect x="72" y="170" width="330" height="360" rx="22" class="card"/>
  <text x="237" y="220" text-anchor="middle" class="card-title">錯誤做法</text>
  <rect x="112" y="255" width="250" height="178" rx="14" class="bad"/>
  <text x="135" y="299" class="code">const GEMINI_API_KEY</text>
  <text x="135" y="331" class="code">  = 'AIza...';</text>
  <text x="135" y="379" class="code">const LINE_TOKEN</text>
  <text x="135" y="411" class="code">  = 'Bearer ...';</text>
  <text x="237" y="475" text-anchor="middle" class="body">密鑰跟著程式碼外流</text>
  <line x1="150" y1="260" x2="330" y2="430" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>
  <line x1="330" y1="260" x2="150" y2="430" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>

  <rect x="475" y="170" width="330" height="360" rx="22" class="card"/>
  <text x="640" y="220" text-anchor="middle" class="card-title">建議做法</text>
  <rect x="520" y="258" width="240" height="170" rx="18" class="good"/>
  <path d="M582 328v-34c0-36 116-36 116 0v34" fill="none" stroke="#16a34a" stroke-width="14" stroke-linecap="round"/>
  <rect x="560" y="320" width="160" height="92" rx="18" fill="#16a34a"/>
  <circle cx="640" cy="361" r="14" fill="#bbf7d0"/>
  <rect x="632" y="372" width="16" height="26" rx="8" fill="#bbf7d0"/>
  <text x="640" y="475" text-anchor="middle" class="body">Script Properties 保存密鑰</text>

  <rect x="878" y="170" width="330" height="360" rx="22" class="card"/>
  <text x="1043" y="220" text-anchor="middle" class="card-title">程式只讀取</text>
  <rect x="922" y="265" width="242" height="168" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="944" y="305" class="code">PropertiesService</text>
  <text x="944" y="337" class="code">.getScriptProperties()</text>
  <text x="944" y="385" class="code">.getProperty(...)</text>
  <text x="1043" y="475" text-anchor="middle" class="body">部署時不暴露真正 Key</text>

  <path d="M406 350 H464" class="arrow"/>
  <path d="M809 350 H867" class="arrow"/>

  <rect x="170" y="585" width="940" height="72" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="640" y="630" text-anchor="middle" class="body">外洩時立刻撤銷舊 Key、重產新 Key，並檢查 API 使用量與試算表權限。</text>
</svg>
