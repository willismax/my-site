<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Webhook 部署與聊天紀錄資料保護</title>
  <desc id="desc">GAS Web App URL 加上 key 參數後設定到 LINE Developers，同時注意聊天紀錄的權限、告知、脫敏與保存期限。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1f2937" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 34px "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; filter: url(#shadow); }
      .card-title { font: 700 24px "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif; fill: #111827; }
      .body { font: 400 18px "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif; fill: #475569; }
      .code { font: 700 18px Consolas, "Courier New", monospace; fill: #334155; }
      .arrow { stroke: #7c3aed; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .check { font: 700 22px Arial, sans-serif; fill: #059669; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="64" y="72" class="title">部署後的兩件事：Webhook 門禁與紀錄保護</text>
  <text x="64" y="106" class="subtitle">上線不是只看能不能回覆，也要看誰能打進來、資料會被保存多久。</text>

  <rect x="78" y="170" width="330" height="220" rx="22" class="card"/>
  <text x="243" y="220" text-anchor="middle" class="card-title">1. GAS Web App</text>
  <rect x="112" y="258" width="262" height="64" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="130" y="297" class="code">/exec?key=SECRET</text>
  <text x="243" y="354" text-anchor="middle" class="body">把 shared secret 放在網址參數</text>

  <rect x="475" y="170" width="330" height="220" rx="22" class="card"/>
  <text x="640" y="220" text-anchor="middle" class="card-title">2. LINE Developers</text>
  <rect x="520" y="258" width="240" height="66" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
  <text x="640" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#15803d">Webhook URL</text>
  <text x="640" y="354" text-anchor="middle" class="body">貼上完整 URL 並啟用 Use webhook</text>

  <rect x="872" y="170" width="330" height="220" rx="22" class="card"/>
  <text x="1037" y="220" text-anchor="middle" class="card-title">3. GAS 檢查</text>
  <rect x="930" y="258" width="214" height="74" rx="16" fill="#ecfeff" stroke="#06b6d4" stroke-width="3"/>
  <text x="1037" y="304" text-anchor="middle" class="code">e.parameter.key</text>
  <text x="1037" y="354" text-anchor="middle" class="body">不符合就拒絕處理</text>

  <path d="M410 280 H466" class="arrow"/>
  <path d="M807 280 H863" class="arrow"/>

  <rect x="78" y="470" width="1124" height="150" rx="22" class="card"/>
  <text x="118" y="518" class="card-title">聊天紀錄保存檢查表</text>
  <text x="122" y="565" class="check">✓</text>
  <text x="155" y="566" class="body">只授權課程管理者存取試算表</text>
  <text x="477" y="565" class="check">✓</text>
  <text x="510" y="566" class="body">事先告知會保存對話紀錄</text>
  <text x="792" y="565" class="check">✓</text>
  <text x="825" y="566" class="body">定期刪除、匿名化或脫敏</text>
</svg>
